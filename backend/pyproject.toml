[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-true-vectorless-rag"
version = "0.1.0"
description = "Scalable agentic vectorless RAG system for page-indexed document retrieval"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pymupdf>=1.25,<2.0",
    "httpx>=0.28,<1.0",
    "structlog>=25.1,<26.0",
    "mistralai>=1.12,<2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0"
]

[tool.setuptools.packages.find]
include = [
    "app",
    "app.*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N"
]

[tool.mypy]
python_version = "3.13"
strict = true